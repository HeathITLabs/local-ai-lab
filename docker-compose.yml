# Local AI Lab compose. Ollama and ComfyUI run natively on Windows.
# Containers reach them through Docker host-gateway aliases.

name: localai
volumes:
  n8n_storage: null
  qdrant_storage: null
  solo-postgres-data: null
  clickhouse-data: null
  langfuse-redis-data: null
  langfuse-minio-data: null
  open-webui:
    name: localai_open-webui
  flowise: null
  caddy-data: null
  caddy-config: null
  valkey-data: null
  langfuse-db: null
  neo4j-data: null
x-watchtower-labels:
  labels: &id001
    - com.centurylinklabs.watchtower.enable=true
x-n8n:
  labels: *id001
  image: n8nio/n8n:latest
  pull_policy: always
  environment: &id002
    - DB_TYPE=sqlite
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY
    - N8N_USER_MANAGEMENT_JWT_SECRET
    - WEBHOOK_URL=http://${N8N_HOSTNAME:-localhost:5678}
    - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
services:
  watchtower:
    image: containrrr/watchtower:latest
    pull_policy: always
    container_name: watchtower
    restart: unless-stopped
    profiles:
      - auto-update
    command:
      - --label-enable
      - --cleanup
      - --rolling-restart
      - --interval
      - "86400"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  flowise:
    labels: *id001
    image: flowiseai/flowise
    pull_policy: always
    restart: unless-stopped
    container_name: flowise
    expose:
      - 3001/tcp
    environment:
      - PORT=3001
      - FLOWISE_USERNAME=${FLOWISE_USERNAME}
      - FLOWISE_PASSWORD=${FLOWISE_PASSWORD}
    extra_hosts:
      - host.docker.internal:host-gateway
      - ollama:host-gateway
    volumes:
      - ~/.flowise:/root/.flowise
    entrypoint: /bin/sh -c "sleep 3; flowise start"
  open-webui:
    labels: *id001
    image: ghcr.io/open-webui/open-webui:main
    pull_policy: always
    restart: unless-stopped
    container_name: open-webui
    ports:
      - 3190:8080
    extra_hosts:
      - host.docker.internal:host-gateway
      - ollama:host-gateway
    environment:
      - WEBUI_URL=http://192.168.1.139:3190
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - open-webui:/app/backend/data
  solo:
    build:
      context: D:/AI/solo
      dockerfile: Dockerfile
    container_name: solo
    restart: unless-stopped
    ports:
      - 3050:3050
    expose:
      - 3050/tcp
    environment:
      - NODE_ENV=production
      - PORT=3050
      - ALLOWED_ORIGINS=*
      - LOG_LEVEL=info
      - DB_PROVIDER=postgres
      - POSTGRES_HOST=solo-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=solo
      - POSTGRES_USER=solo
      - POSTGRES_PASSWORD=solo
      - SQLITE_PATH=/data/solo/db/solo.db
      - SQLITE_EXPECTED_PATH=/data/solo/db/solo.db
      - SQLITE_SCHEMA_PATH=/app/docs/sql/schema.sql
      - SOLO_DATA_DIR=/data/solo/db
      - STABLE_DIFFUSION_IMAGES=/data/solo/images
      - SOLO_ATTACHMENTS_PATH=/data/solo/attachments
      - SOLO_BACKUP_SETTINGS_PATH=/data/solo/db/database-backup-settings.json
      - SOLO_BACKUPS_PATH=/data/solo/backups
      - SOLO_LOG_DIR=/data/solo/logs
      - LOCAL_LLM_BASE_URL=http://host.docker.internal:1234
      - LLM_PROVIDER=local
      - LLM_MODEL=qwen2.5:7b-instruct-q4_K_M
      - STABLE_DIFFUSION_URL=http://comfyui-host:8188
      - STABLE_DIFFUSION_PROVIDER=comfyui
      - LANGFUSE_HOST=http://langfuse:3000
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:?LANGFUSE_PUBLIC_KEY is required}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:?LANGFUSE_SECRET_KEY is required}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-your_password}
      - NEO4J_DATABASE=neo4j
      - ENABLE_NEO4J=true
    volumes:
      - D:/AI/solo/data/db:/data/solo/db
      - D:/AI/solo-data/images:/data/solo/images
      - D:/AI/solo-data/attachments:/data/solo/attachments
      - D:/AI/solo-data/backups:/data/solo/backups
      - D:/AI/solo-data/logs:/data/solo/logs
    depends_on:
      solo-postgres:
        condition: service_healthy
      langfuse:
        condition: service_started
      neo4j:
        condition: service_healthy
    extra_hosts:
      - host.docker.internal:host-gateway
      - ollama:host-gateway
      - comfyui-host:host-gateway
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3050/api/health/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  solo-postgres:
    labels: *id001
    image: postgres:15-alpine
    pull_policy: always
    container_name: solo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=solo
      - POSTGRES_USER=solo
      - POSTGRES_PASSWORD=solo
    volumes:
      - solo-postgres-data:/var/lib/postgresql/data
    ports:
      - 5437:5432
    expose:
      - 5432/tcp
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U solo -d solo
      interval: 3s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  langfuse-db:
    labels: *id001
    image: postgres:15-alpine
    pull_policy: always
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=langfuse
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse
    volumes:
      - langfuse-db:/var/lib/postgresql/data
    expose:
      - 5432/tcp
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U langfuse -d langfuse
      interval: 3s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  clickhouse:
    labels: *id001
    image: clickhouse/clickhouse-server:24.3-alpine
    pull_policy: always
    container_name: clickhouse
    restart: unless-stopped
    expose:
      - 8123/tcp
      - 9000/tcp
    environment:
      - CLICKHOUSE_DB=default
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8123/ping | grep -q Ok.
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  langfuse-redis:
    labels: *id001
    image: redis:7-alpine
    pull_policy: always
    container_name: langfuse-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${LANGFUSE_REDIS_AUTH:-myredissecret}
      - --maxmemory-policy
      - noeviction
    expose:
      - 6379/tcp
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a ${LANGFUSE_REDIS_AUTH:-myredissecret} ping | grep -q PONG
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  langfuse-minio:
    labels: *id001
    image: minio/minio:latest
    pull_policy: always
    container_name: langfuse-minio
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -lc
      - 'mkdir -p /data/langfuse

        minio server --address ":9000" --console-address ":9001" /data

        '
    expose:
      - 9000/tcp
      - 9001/tcp
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-miniosecret}
    volumes:
      - langfuse-minio-data:/data
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  langfuse:
    labels: *id001
    image: langfuse/langfuse:3
    pull_policy: always
    container_name: langfuse
    restart: unless-stopped
    ports:
      - 3000:3000
    expose:
      - 3000/tcp
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_MIGRATION_URL=clickhouse://clickhouse:9000
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
      - CLICKHOUSE_CLUSTER_ENABLED=false
      - REDIS_HOST=langfuse-redis
      - REDIS_PORT=6379
      - REDIS_AUTH=${LANGFUSE_REDIS_AUTH:-myredissecret}
      - LANGFUSE_S3_EVENT_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_EVENT_UPLOAD_REGION=auto
      - LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-miniosecret}
      - LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE=true
      - LANGFUSE_S3_MEDIA_UPLOAD_BUCKET=langfuse
      - LANGFUSE_S3_MEDIA_UPLOAD_REGION=auto
      - LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID=${MINIO_ROOT_USER:-minio}
      - LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-miniosecret}
      - LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT=http://langfuse-minio:9000
      - LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE=true
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=mysecret
      - SALT=mysalt
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      - TELEMETRY_ENABLED=false
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  n8n-import:
    labels: *id001
    image: n8nio/n8n:latest
    pull_policy: always
    environment: *id002
    container_name: n8n-import
    entrypoint: /bin/sh
    command:
      - -lc
      - 'set -e

        [ -d /backup/credentials ] && n8n import:credentials --separate --input=/backup/credentials
        || echo "no credentials to import"

        [ -d /backup/workflows ] && n8n import:workflow --separate --input=/backup/workflows
        || echo "no workflows to import"

        exit 0

        '
    volumes:
      - ./n8n/backup:/backup
  n8n:
    labels: *id001
    image: n8nio/n8n:latest
    pull_policy: always
    environment: *id002
    container_name: n8n
    restart: unless-stopped
    expose:
      - 5678/tcp
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
      - ./shared:/data/shared
    depends_on:
      n8n-import:
        condition: service_completed_successfully
  qdrant:
    labels: *id001
    image: qdrant/qdrant
    pull_policy: always
    container_name: qdrant
    restart: unless-stopped
    expose:
      - 6333/tcp
      - 6334/tcp
    volumes:
      - qdrant_storage:/qdrant/storage
  neo4j:
    labels: *id001
    image: neo4j:5.20.0
    pull_policy: always
    container_name: neo4j
    hostname: neo4j
    restart: unless-stopped
    expose:
      - 7473/tcp
      - 7474/tcp
      - 7687/tcp
    extra_hosts:
      - neo4j:127.0.0.1
    volumes:
      - neo4j-data:/data
      - ./neo4j/logs:/logs
      - ./neo4j/plugins:/plugins
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-your_password}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_server_default__advertised__address=127.0.0.1
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  caddy:
    labels: *id001
    container_name: caddy
    image: docker.io/library/caddy:2-alpine
    pull_policy: always
    restart: unless-stopped
    ports:
      - 80:80/tcp
      - 443:443/tcp
    expose:
      - 2019/tcp
      - 443/tcp
      - 443/udp
      - 80/tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-addon:/etc/caddy/addons:ro
      - caddy-data:/data:rw
      - caddy-config:/config:rw
    environment:
      - N8N_HOSTNAME=${N8N_HOSTNAME:-:8001}
      - WEBUI_HOSTNAME=${WEBUI_HOSTNAME:-:8002}
      - FLOWISE_HOSTNAME=${FLOWISE_HOSTNAME:-:8003}
      - OLLAMA_HOSTNAME=${OLLAMA_HOSTNAME:-:8004}
      - SEARXNG_HOSTNAME=${SEARXNG_HOSTNAME:-:8006}
      - NEO4J_HOSTNAME=${NEO4J_HOSTNAME:-:8008}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-internal}
    extra_hosts:
      - ollama:host-gateway
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
  redis:
    labels: *id001
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    pull_policy: always
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    expose:
      - 6379/tcp
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 10s
      retries: 10
  searxng:
    labels: *id001
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    pull_policy: always
    restart: unless-stopped
    expose:
      - 8080/tcp
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://${SEARXNG_HOSTNAME:-localhost}/
      - UWSGI_WORKERS=${SEARXNG_UWSGI_WORKERS:-4}
      - UWSGI_THREADS=${SEARXNG_UWSGI_THREADS:-4}
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "1"
